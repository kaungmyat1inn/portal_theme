<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1'><meta http-equiv='Cache-Control' content='no-cache'><title>{{SHOP_NAME}}</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Segoe UI',Arial,sans-serif;color:#f4f6fb}body{min-height:100vh;background:url('./bg.jpg') center/cover fixed no-repeat;display:flex;justify-content:center;padding:28px 18px}body:before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:-1}main{width:min(100%,430px);align-self:center;position:relative}.brand{margin-bottom:22px}.tabs{display:flex;gap:7px;padding:5px;background:#0003;border-radius:10px;margin-bottom:18px}.tabs button{flex:1;border:0;background:transparent;color:#929aad;padding:11px 6px;border-radius:8px;font-weight:700;font-family:inherit;cursor:pointer}.tabs button.active{background:#7c5cff;color:#ffffff}.field{display:none}.field.active{display:block}.field label{display:block;font-size:13px;color:#929aad;margin:0 0 7px}.field input{width:100%;height:50px;border:1px solid #303541;border-radius:10px;background:#0003;color:#f4f6fb;padding:0 14px;font-size:16px;outline:none;font-family:inherit}.field input:focus{border-color:#7c5cff}#message{min-height:24px;padding-top:7px;color:#ff8a80;font-size:12px;text-align:center}#login{width:100%;height:50px;border:0;border-radius:10px;background:#7c5cff;color:#ffffff;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer}.packages{margin-top:24px}.packages h2{text-align:center;font-size:13px;letter-spacing:.6px;color:#929aad;margin:0 0 11px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.package{min-height:66px;border:1px solid #303541;border-radius:10px;background:#0003;color:#f4f6fb;padding:10px}.package strong,.package span{display:block;overflow-wrap:anywhere}.package strong{font-size:14px}.package span{margin-top:5px;color:#7c5cff;font-size:13px;font-weight:800}@media(max-height:640px){main{align-self:flex-start}.brand{margin-bottom:15px}.packages{margin-top:17px}}main{padding:30px 24px 26px}.brand{text-align:left}.brand h1{font-size:24px;margin:0 0 5px;letter-spacing:-.5px}.brand p{margin:0;color:#929aad;font-size:13px}.field input{background:#0c0f15}</style></head><body><main><header class='brand'><h1>{{SHOP_NAME}}</h1><p>Connect with your voucher or account</p></header><nav class="tabs" id="tabs"></nav><section class="field" id="voucher-field"><label>Voucher Code</label><input id="voucher" autocomplete="one-time-code" placeholder="Enter voucher code"></section><section class="field" id="account-field"><label>Username</label><input id="account" autocomplete="username" placeholder="Enter username"><label style="margin-top:10px">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter password"></section><div id="message"></div><button id="login" type="button">Connect to Internet</button>{{PACKAGES_SECTION}}</main><script>var currentAuth='voucher';function sessionId(){try{return new URL(window.top.location.href).searchParams.get('sessionId')}catch(e){return new URL(location.href).searchParams.get('sessionId')}}function chooseAuth(type){currentAuth=type;document.querySelectorAll('.field').forEach(function(e){e.classList.remove('active')});document.querySelectorAll('.tabs button').forEach(function(e){e.classList.toggle('active',e.dataset.auth===type)});var field=document.getElementById(type+'-field');if(field)field.classList.add('active')}function selectVoucher(){chooseAuth('voucher');document.getElementById('voucher').focus()}function loadConfig(data){var allowed=['voucher','fixaccount'];var options=((data.custom_html&&data.custom_html.login_options)||['voucher']).filter(function(value){return allowed.indexOf(value)>=0});if(!options.length)options=['voucher'];var labels={voucher:'Voucher',fixaccount:'Account'};var map={voucher:'voucher',fixaccount:'account'};var tabs=document.getElementById('tabs');tabs.innerHTML='';options.forEach(function(value){var auth=map[value]||value;var b=document.createElement('button');b.type='button';b.dataset.auth=auth;b.textContent=labels[value]||value;b.onclick=function(){chooseAuth(auth)};tabs.appendChild(b)});var preferred=options.indexOf('voucher')>=0?'voucher':(map[options[0]]||options[0]);chooseAuth(preferred)}async function login(){var message=document.getElementById('message');message.textContent='';var payload={lang:'en_US',authType:currentAuth,sessionId:sessionId()};if(currentAuth==='voucher'){payload.account=document.getElementById('voucher').value.trim();if(!payload.account){message.textContent='Please enter voucher code';return}}else if(currentAuth==='account'){payload.authType='fixaccount';payload.account=document.getElementById('account').value.trim();payload.password=document.getElementById('password').value;if(!payload.account||!payload.password){message.textContent='Please enter username and password';return}}else{message.textContent='Please choose Voucher or Account login';return}var button=document.getElementById('login');button.disabled=true;button.textContent='Connecting...';try{var response=await fetch('/api/auth/general',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});var result=await response.json();if(result.success&&result.result&&result.result.logonUrl){location.href=result.result.logonUrl}else{message.textContent=result.message||'Login failed'}}catch(e){message.textContent='Unable to connect'}finally{button.disabled=false;button.textContent='Connect to Internet'}}document.getElementById('login').addEventListener('click',login);</script><script src='./loadConfig.json'></script></body></html>

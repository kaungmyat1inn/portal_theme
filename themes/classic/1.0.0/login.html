<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>{{SHOP_NAME}}</title><script>function mwLogin(f){f.username.value=f.username.value.toUpperCase().trim();f.password.value=f.username.value;return true;}</script></head><body><style>*{box-sizing:border-box}body{margin:0;font-family:Georgia,'Times New Roman',serif;background:linear-gradient(135deg,#f2eadb,#dfcfb4);color:#30271d;display:grid;place-items:center;min-height:100vh;padding:18px}body::before{content:'';position:fixed;inset:12px;border:1px solid #744a2433;pointer-events:none}.wrap{width:min(89vw,365px)}.card{padding:42px 30px 32px}.ornament{display:flex;align-items:center;gap:10px;margin:0 auto 25px;color:#744a24}.ornament::before,.ornament::after{content:'';height:1px;flex:1;background:#c8b28f}.diamond{width:10px;height:10px;background:#744a24;transform:rotate(45deg)}.brand{color:#30271d;text-align:center;margin:0 0 8px;font-size:30px;font-weight:600}.sub{text-align:center;color:#796956;margin:0 0 25px;font-size:14px;font-style:italic}.field{width:100%;padding:13px 14px;margin:7px 0;border:1px solid #c8b28f;border-radius:10px;font-size:15px;background:#fffaf0;color:#30271d;text-transform:uppercase;font-family:inherit}.btn{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:#744a24;color:#fffaf0;font-size:15px;font-weight:700;margin-top:10px;text-align:center;text-decoration:none;font-family:inherit;cursor:pointer}.error{color:#e5484d;text-align:center;font-size:13px;margin:12px 0 0;min-height:14px}.ok{color:#744a24;text-align:center;font-size:44px}.rows{margin:6px 0 0}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #c8b28f}.row span{color:#796956}.field{border-radius:0;background:#fffdf7;border:1px solid #c8b28f;padding:14px}.field:focus{outline:1px solid #744a24;outline-offset:2px}.btn{border-radius:0;padding:14px;text-transform:uppercase;letter-spacing:2px;font-size:13px}.error{font-family:Arial,sans-serif}</style><main class='wrap'><div class='card'><div class='ornament'><i class='diamond'></i></div><h2 class='brand'>{{SHOP_NAME}}</h2><p class='sub'>Enter your access code</p><form action='$(link-login-only)' method='post' onsubmit='return mwLogin(this)'><input type='hidden' name='dst' value='$(link-status)'><input class='field' name='username' value='$(username)' placeholder='Access Code' required><input type='hidden' name='password' value=''><button class='btn' type='submit'>Connect</button></form><p class='error'>$(error)</p></div></main></body></html>

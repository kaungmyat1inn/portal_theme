<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>{{SHOP_NAME}}</title></head><body><style>*{box-sizing:border-box}body{margin:0;font-family:'Courier New',monospace;background:linear-gradient(#07101acc 1px,transparent 1px),linear-gradient(90deg,#07101acc 1px,transparent 1px),radial-gradient(circle at 80% 12%,#ff2bd63d,transparent 36%),#02050a;color:#f6f8ff;display:grid;place-items:center;min-height:100vh;padding:18px}body{background-size:32px 32px,32px 32px,auto,auto}.wrap{width:min(90vw,375px)}.card{padding:39px 25px 29px}.signal{display:flex;gap:5px;margin-bottom:25px}.signal i{display:block;height:5px;background:#20f6ff}.signal i:nth-child(1){width:48px}.signal i:nth-child(2){width:14px;background:#ff2bd6}.signal i:nth-child(3){width:7px}.brand{color:#f6f8ff;text-align:left;margin:0 0 7px;font-size:27px;text-transform:uppercase;letter-spacing:1px;text-shadow:3px 0 0 #ff2bd66b,-2px 0 0 #20f6ff55}.sub{text-align:left;color:#81dce4;margin:0 0 24px;font-size:12px;text-transform:uppercase;letter-spacing:.8px}.field{width:100%;padding:13px 14px;margin:7px 0;border:1px solid #ff2bd6;border-radius:10px;font-size:15px;background:#080d17f2;color:#f6f8ff;text-transform:uppercase;font-family:inherit}.btn{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:#20f6ff;color:#02070c;font-size:15px;font-weight:700;margin-top:10px;text-align:center;text-decoration:none;font-family:inherit;cursor:pointer}.error{color:#e5484d;text-align:center;font-size:13px;margin:12px 0 0;min-height:14px}.ok{color:#20f6ff;text-align:center;font-size:44px}.rows{margin:6px 0 0}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #ff2bd6}.row span{color:#81dce4}.field{background:#02050a;border:1px solid #20f6ff80;border-left:4px solid #ff2bd6;border-radius:0;color:#f6f8ff;padding:15px 13px;outline:none}.field:focus{border-color:#20f6ff;box-shadow:0 0 15px #20f6ff33}.field::placeholder{color:#6d8390}.btn{border-radius:0;text-transform:uppercase;letter-spacing:2px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));box-shadow:inset -5px -5px 0 #0bb7c3}</style><main class='wrap'><div class='card'><div class='signal'><i></i><i></i><i></i></div><h2 class='brand'>{{SHOP_NAME}}</h2><p class='sub'>Opening login page...</p><a class='btn' href='$(link-login-only)'>Open Login</a></div></main></body></html>

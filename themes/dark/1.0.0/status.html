<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>{{SHOP_NAME}} Connected</title><meta http-equiv='refresh' content='10'></head><body><style>*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:radial-gradient(circle at 50% -10%,#30364a 0,transparent 45%),linear-gradient(160deg,#050609,#0c0f15);color:#f4f6fb;display:grid;place-items:center;min-height:100vh;padding:18px}.wrap{width:min(90vw,370px)}.card{padding:36px 28px 30px}.brand{color:#f4f6fb;text-align:left;margin:0 0 7px;font-size:27px;letter-spacing:-.5px}.sub{text-align:left;color:#929aad;margin:0 0 25px;font-size:14px}.field{width:100%;padding:13px 14px;margin:7px 0;border:1px solid #303541;border-radius:10px;font-size:15px;background:#151820;color:#f4f6fb;text-transform:uppercase;font-family:inherit}.btn{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:#7c5cff;color:#ffffff;font-size:15px;font-weight:700;margin-top:10px;text-align:center;text-decoration:none;font-family:inherit;cursor:pointer}.error{color:#e5484d;text-align:center;font-size:13px;margin:12px 0 0;min-height:14px}.ok{color:#7c5cff;text-align:center;font-size:44px}.rows{margin:6px 0 0}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #303541}.row span{color:#929aad}.field{background:#0c0f15;border:1px solid #303541;border-radius:12px;color:#f4f6fb;padding:15px;outline:none}.field:focus{border-color:#7c5cff;box-shadow:0 0 0 3px #7c5cff1f}.field::placeholder{color:#6f7789}.btn{border-radius:12px;padding:15px}</style><main class='wrap'><div class='card'><h2 class='brand'>Connected</h2><p class='sub'></p><section class='rows'><div class='row'><span>Plan Name</span><strong>$(profile)</strong></div><div class='row'><span>Code</span><strong>$(username)</strong></div></section><form action='$(link-logout)' method='post'><button class='btn' type='submit'>Disconnect</button></form></div></main></body></html>
